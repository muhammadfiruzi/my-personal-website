<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Firuzi</title>
    <link rel="icon" type="image/png" href="https://muhammadfiruzi.ir/images/profile_file.webp">
    <style>
        
        @font-face {
            font-family: "hellofont";
            src: url('https://muhammadfiruzi.ir/fonts/digikala-variable.26clo6kef3v8o.woff2') format('woff2');
        }

        @font-face {
            font-family: 'MyFont';
            src: url('/fonts/Ingo-Regular.otf') format('opentype');
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;

            background-image: url("https://muhammadfiruzi.ir/images/background_file.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            transform: translateY(-50px);
        }
        h1 {
            font-family: 'hellofont';
            font-size: 60px;
            text-align: center;
            color: white;
        }
        b{
            
            font-family: 'MyFont', sans-serif;
            
            font-size: 25px;
            text-align: center;
            color: white;
            text-shadow:
            2px 2px 4px black,
            0px 0px 10px black,
            0px 0px 20px black;

        }
        .profile {
            width: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

    </style>
</head>
<body>
    
    <img src="https://muhammadfiruzi.ir/images/profile_file.webp"
     alt="My Photo"
     class="profile">

    <h1>
        چیزای شگفت انگیزی توی راهه
    </h1>
    <br>
    <b> MUHAMMAD FIRUZI </b>
</body>
</html>
